projects:

  - name: MediScan
    slug: mediscan
    status: live
    feature: true
    tag: I2CE Lab VIP, team lead, 2026
    text: "Portable point-of-care diagnostics for low-resource clinics. Led the electromechanical design: 65°C closed-loop heating, four-channel optical detection and a solar-charged power board."
    page:
      title: MediScan
      crumb: MediScan
      description: "MediScan, I2CE Lab VIP: a portable point-of-care diagnostic platform for low-resource clinics. Led the electromechanical design across the NAAT, fluorescence and power modules."
      headline: Point-of-care diagnostics for low-resource clinics.
      roleLine: Team Lead, Cluster 4, I2CE Lab VIP, Jan to May 2026
      lead: MediScan screens a urine sample for multiple diseases without a central lab. I led the electromechanical design across its NAAT, fluorescence and power modules.
      stats:
        - { value: $3.08, label: per NAAT test }
        - { value: 65°C, label: closed-loop heating }
        - { value: "4", label: optical channels on the sensing board }
        - { value: 9.1%, label: battery per 20-minute reading }
      brief:
        what: "MediScan: a portable, non-invasive platform that screens a urine sample for multiple diseases at the point of care."
        why: Nearly 47% of the world lacks access to essential diagnostics (WHO, 2021), so diseases are caught late.
        how:
          - "NAAT held at 65°C by an ESP32 PI loop: boost converter, MOSFET PWM, thermistor, thermal fuse"
          - Four blue-LED and photodiode channels reading fluorescence in reflection
          - Solar and USB-C charged power board shared by the NAAT and fluorescence modules
        results:
          - $3.08 per test, $57.22 per NAAT device
          - 9.1% of the battery per 20-minute reading
          - Boards finalized and sent for fabrication
    facts:
      - Akkhil was team lead and led the electromechanical design across the NAAT, fluorescence and power modules (confirmed Sept 25, 2026).
      - "NAAT: LAMP at constant 65°C for Zika (NS5), dengue (3' UTR), malaria (18S rRNA), RNase P internal control. ESP32 PI(D) heater loop, 5V heater via boost converter (3.3 to 5V), low-side MOSFET PWM 1 to 2 kHz, thermistor, soldered thermal fuse. Blue LED excitation, green fluorescence read in reflection by photodiodes."
      - "CAD (public/models/*.glb via tools/cad-to-glb.py): NAAT sensing board 17.7 x 69.3 mm with 4 Lite-On blue LEDs and 4 Vishay TEMD6200 photodiodes on the underside, TI boost IC and 10 mm inductor, MOSFET, JST and Molex connectors. Hybrid board 47.9 x 57.4 mm with ESP32-WROOM-32E, USB-C, Silicon Labs USB-UART, 2 tactile buttons, display connector."
      - "Fluorescence: ESP32-S3, two AS7341 sensors (control and test line); HE4, LYVE-1, PSA, KIM-1, NGAL."
      - "Power: 3.7V 5000 mAh LiPo, solar and USB-C charging, 3.3V regulator, 2.4 inch TFT. Worst case 4.45 W; 1.69 Wh (9.1%) per 20-minute reading; about 37 h full solar charge."
      - "Cost: $57.22 per NAAT device, $3.08 per test."
      - The 4-channel to 4-target mapping in the sensing interactive is an inference from the CAD; labelled illustrative. Chip, heater plate and stacked layout in the 3D view are simplified.
    sources: ["Documents/VIP/2026: Spring 2026 final deck and CAD (the Fall 2025 notebook is NOT a source)"]
    open:
      - Deck says "at least 12 measurements" per charge, but 18.5 Wh / 1.69 Wh is about 10.9. Site says "about ten". Which is right?
      - Team size? Photos of the built prototype?


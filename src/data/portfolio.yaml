experience:

  - slug: whoop
    company: WHOOP
    role: Manufacturing Test Engineering Intern
    dates: Jan 2026 to Jun 2026
    summary: Distributed test infrastructure, automated optical validation, and embedded diagnostic systems.
    stat: $1.8M
    statLabel: saved by battery diagnostics
    page:
      title: WHOOP
      crumb: WHOOP
      description: "Manufacturing test engineering at WHOOP: an optical characterization fixture, a current-based capacitor triage screen that saved $1.8M, and DAG-based ATE test software."
      headline: Scaling test for a wearable fleet.
      roleLine: Manufacturing Test Engineering Intern, WHOOP, Jan 2026 to Jun 2026
      lead: Led three core systems across R&D and Manufacturing Engineering, an optical characterization fixture, a capacitor triage screen and ATE test software, plus yield, AI and characterization work.
      stats:
        - { value: $1.8M, label: saved by capacitor triage }
        - { value: 20 s, label: "battery screen, down from 250 s" }
        - { value: 30%, label: faster fleet test time }
        - { value: 40%, label: fewer false failures }
      brief:
        what: Built WHOOP's optical characterization fixture, a production screen that triages failing capacitors from current alone, and DAG-based ATE test software, owning each from requirements through validation, deployment and handoff.
        why: Production test had to scale with the fixture fleet and catch more battery failures without adding cycle time, and new sensors needed a repeatable way to be characterized.
        how:
          - "Optical fixture: motion control and data acquisition for a Thorlabs 3-axis stage and Feasa LED and IR analysers"
          - "Capacitor triage: BLE current streaming, FFT feature extraction and an inline logistic-regression classifier"
          - "ATE software: dependency-aware DAG test orchestration in Python and pytest across 12 fixtures"
        results:
          - $1.8M saved; 99% accuracy flagging bad capacitors
          - Battery screen cut from 250 s to about 20 s
          - 30% faster test time, 95% pytest coverage
          - 40% fewer false failures
      core:
        - key: optical
          title: Optical characterization fixture
          summary: Automated 3-axis optical test fixture that maps the sensor's LED output in 3D, taken from design to a documented platform the team runs.
          points:
            - Built motion control and data acquisition for a Thorlabs 3-axis stage (K-Cube controllers) and Feasa LED and IR analysers read through a fiber probe, with configurable scan volumes and user-defined motion profiles
            - Designed and toleranced the fixture, then ran repeatability and probe-tolerance studies on WHOOP 5.0 and next-generation hardware, including glass versus plastic optics
            - Wrote the LED calibration method and visualization tooling, documented SOPs, and onboarded engineers to run it independently
          stack: [Thorlabs K-Cube, Feasa LED and IR analysers, Fiber optics, Fixture design and tolerancing, Repeatability studies]
          result: Defined hardware-specific limits for optical testing on a platform handed off to the team
        - key: capacitor
          title: Capacitor triage from current alone
          summary: Production screen that flags failing battery capacitors from their current signature.
          points:
            - Streamed raw battery current from device firmware over BLE and extracted FFT features for an inline logistic-regression classifier
            - Validated against failure-analysis teardowns, CT-scan correlation and a large production DOE run with the contract manufacturer
            - Built a modular full-stack monitoring platform for Reliability and Manufacturing, and shipped the screen to production behind a feature flag
          stack: [BLE, HCI, FFT, Logistic regression, DOE]
          result: $1.8M saved, 99% accuracy, screen cut from 250 s to about 20 s
        - key: ate
          title: ATE test software
          summary: Distributed hardware-in-the-loop test framework across a 12-fixture fleet.
          points:
            - Re-architected serial legacy ATE into dependency-aware, DAG-scheduled test orchestration in Python across 12 fixtures
            - Raised pytest coverage to 95% and used fleet-wide analysis to separate rig faults from real device defects
            - Prototyped and demoed the DAG orchestration layer for next-generation test software
          stack: [Python, pytest, DAG orchestration, Hardware-in-the-loop]
          result: 30% faster test time, 95% pytest coverage, 40% fewer false failures
      more:
        - title: IR yield improvement
          summary: Root-caused IR LED measurement noise to test-software timing in the analog front end across 10+ experiments, then shipped the fix to manufacturing software.
          stack: [Root-cause analysis, GRR studies, AFE timing]
          result: About 95% less IR measurement noise (expected)
        - title: FA Bot
          summary: AI failure-analysis assistant using retrieval-augmented generation over the first consolidated failure-analysis database, with multilingual support, piloted in manufacturing.
          stack: [RAG, Embeddings, Vector search, Transformers]
          result: Search 40 s to 140 ms; startup 60 s to 6 s
        - title: LED and photodiode benchtop test
          summary: Set fixture geometry, distances and materials for RGB, IR and SWIR optical tests and standardized the procedure for other engineers.
          stack: [Optical test design, RGB, IR and SWIR, SOPs]
        - title: IMU characterization
          summary: Reverse-engineered device communication protocols and built the IMU test fixture, data collection and visualization tools.
          stack: [Protocol reverse engineering, Fixture design, Data visualization]
        - title: JTAG feasibility study
          summary: Assessed boundary-scan testing for manufacturing, covering supplier requirements, infrastructure and engineering lift, and recommended against it.
          stack: [JTAG boundary scan, Cost-benefit analysis]
          result: Avoided a low-ROI investment
    facts:
      - Thorlabs 3-axis translation stage (NOT 5-axis; the resume should also say 3-axis). Thorlabs K-Cube motor controllers.
      - DUT is a WHOOP 5.0, fixed sensor-side up in a base-plate pocket; the stage moves the fiber probe above it.
      - Rig is an optical breadboard, vertical fiber probe, Feasa LED Analyser and Feasa IR Analyser, cardboard blackout enclosure.
